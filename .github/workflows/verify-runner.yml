name: Verify Runner

on:
  pull_request:
  push:
    branches:
      - feat/codex-runner-mvp
    paths:
      - 'bin/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/verify-runner.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node ./bin/shipflow.js --help
      - run: npm test
      - run: npm run check
